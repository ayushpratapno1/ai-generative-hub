<!doctype html>
<html lang="en">
{% load static %}

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My ChatBot</title>

  <!-- ★ THEME FLASH PREVENTION — must run before any render -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = (saved === 'dark' || saved === 'light')
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

  <!-- Favicon Links -->
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">

  <!-- Highlight.js — syntax highlighting for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css"
    integrity="sha512-Jk4AqjWsdSzSWCSuQTfYRIF84Rq/eV0G2+tu07byYwHcbTGfdmLrHjUSwvzp5HvbiqK4ibmNwdcG49Y5RGYPTg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

  <!-- Main content area -->
  <div class="main-content" style="margin-left: auto;">
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container-fluid">
        <h3 class="navbar-brand site-logo">My ChatBot</h3>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>
      </div>
    </nav>
    <!-- ★ PREMIUM THEME TOGGLE — round icon button -->
    <div class="theme-toggle-wrapper">
      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false"
        aria-label="Switch to dark mode">
        <span class="theme-toggle__icon" aria-hidden="true">
          <!-- Sun SVG -->
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2
                     M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" />
          </svg>
          <!-- Moon SVG -->
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.8A8.8 8.8 0 0 1 9.2 3.5a8.8 8.8 0 1 0 11.3 11.3Z" />
          </svg>
        </span>
      </button>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
      <div id="child">
        <a href="/">Home</a>
      </div>
    </div>

    <!-- Sidebar Toggle Button -->
    <div id="sidebar-toggle" class="sidebar-toggle">
      <span id="sidebar-toggle">☰</span>

    </div>

    <div class="container mt-4">
      <!-- Chat Container -->
      <div class="chat-container d-flex flex-column" id="chat-container">
        <div id="prompt" class="bot-message chat-bubble">
          <strong>Julie:</strong> Hi there! How can I assist you today?
          <span class="timestamp">12:00 PM</span>
        </div>
      </div>

      <!-- Add this new button -->
      <div class="scroll-to-bottom" id="scrollToBottom" title="Scroll to bottom"></div>

      <!-- Input and Submit Button -->
      <div class="input-container">
        <label for="typedPrompt" class="visually-hidden">Ask anything</label>
        <textarea class="expanding-textarea" rows="1" placeholder="Ask anything" id="typedPrompt"
          aria-label="Ask anything" required></textarea>
        {% csrf_token %}
        <button type="button" id="submit" class="send-btn" aria-label="Send message">
          <span class="send-btn__icon" aria-hidden="true">
            <!-- Upward Arrow SVG -->
            <svg class="send-btn__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
            <!-- Loading Spinner SVG -->
            <svg class="send-btn__spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="9" stroke-opacity="0.25"></circle>
              <path d="M12 3a9 9 0 0 1 9 9"></path>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Highlight.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="{% static 'js/theme.js' %}"></script>
  <script src="{% static 'js/script.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
    integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD"
    crossorigin="anonymous"></script>

</body>

</html>
